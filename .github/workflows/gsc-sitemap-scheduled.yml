name: GSC Sitemap Scheduled

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      submit:
        description: Submit the sitemap after live and Search Console status checks
        required: true
        default: false
        type: boolean
  schedule:
    # Economy mode: low-frequency optional work; workflow_dispatch remains available.
    - cron: "17 0 * * 2"

concurrency:
  group: gsc-sitemap-yungyanggogo
  cancel-in-progress: false

jobs:
  gsc-sitemap-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - name: Write GSC credentials
        shell: bash
        env:
          GSC_CREDENTIALS_JSON: ${{ secrets.GSC_CREDENTIALS_JSON }}
        run: |
          if [ -z "$GSC_CREDENTIALS_JSON" ]; then
            echo "GSC_CREDENTIALS_JSON secret is missing"
            exit 1
          fi
          printf '%s' "$GSC_CREDENTIALS_JSON" > "$RUNNER_TEMP/gsc_credentials.json"
      - name: Verify live sitemap and robots
        run: npm run gsc:sitemap:check-live -- --credentials "$RUNNER_TEMP/gsc_credentials.json"
      - name: Read current Search Console sitemap status
        run: npm run gsc:sitemap:status -- --credentials "$RUNNER_TEMP/gsc_credentials.json"
      - name: Submit sitemap to GSC and wait for green status
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.submit == true }}
        run: npm run gsc:sitemap:submit -- --credentials "$RUNNER_TEMP/gsc_credentials.json" --pollAttempts 3 --pollIntervalMs 300000
