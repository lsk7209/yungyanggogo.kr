name: Enrich Nutrition Scheduled

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "수집 실행 건수 (기본 30건)"
        required: false
        default: "30"
        type: string
  schedule:
    # 매 6시간마다 실행 (UTC 00:00, 06:00, 12:00, 18:00 / KST 09:00, 15:00, 21:00, 03:00)
    - cron: "0 */6 * * *"

concurrency:
  group: enrich-nutrition-pipeline
  cancel-in-progress: false

jobs:
  enrich-nutrition:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run nutrition enrichment pipeline
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '30' }}"
          npm run enrich:nutrition -- --limit "$LIMIT"

      - name: Print category enrichment statistics
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npm run enrich:nutrition -- --stats
